<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Started Now</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="sign-up">
        <div class="left">
            <form action="#">
                <h2>Get Started Now</h2>
                <p class="subtitle">Enter your details below</p>
                
                <div class="input-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" placeholder="Enter your name">
                    
                    <label for="email">Email address</label>
                    <input type="email" id="email" placeholder="Enter your email">
                    
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password">
                </div>

                <div class="terms">
                    <input type="checkbox" id="check">
                    <label for="check">I agree to the terms & policy</label>
                </div>

                <input type="submit" value="Signup" class="signup-btn">
                
                <div class="divider">
                    <span>or</span>
                </div>

                <div class="social-btns">
                    <button type="button"><i class="fa-brands fa-google"></i> Sign in with Google</button>
                    <button type="button"><i class="fa-brands fa-apple"></i> Sign in with Apple</button>
                </div>

                <p class="footer-text">Have an account? <a href="#">Sign In</a></p>
            </form>
        </div>
        <div class="right"></div>
    </div>
</body>
</html>
